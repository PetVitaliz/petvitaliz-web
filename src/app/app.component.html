@if (isAdmRoute()) {

  <!-- PAINEL ADMINISTRATIVO: sidebar + conteúdo, sem header/footer públicos -->
  <div class="adm-shell">
    <app-header-adm></app-header-adm>

    <main class="adm-main">
      <router-outlet></router-outlet>
    </main>
  </div>

} @else {

  <app-header
    *ngIf="
      !isFuncionarioRoute() &&
      !isUsuarioRoute()
    ">
  </app-header>

  <app-header-usuario
    *ngIf="isUsuarioRoute()">
  </app-header-usuario>

  <app-header-funcionario
    *ngIf="isFuncionarioRoute()">
  </app-header-funcionario>

  <router-outlet></router-outlet>

  <app-footer></app-footer>

}
