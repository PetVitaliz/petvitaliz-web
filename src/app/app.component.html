@if (isAdmRoute() || isFuncionarioRoute()) {

  <!-- PAINÉIS (admin e funcionário): sidebar + conteúdo, sem header/footer públicos -->
  <div class="adm-shell">
    @if (isAdmRoute()) {
      <app-header-adm></app-header-adm>
    } @else {
      <app-header-funcionario></app-header-funcionario>
    }

    <main class="adm-main">
      <router-outlet></router-outlet>
    </main>
  </div>

} @else if (isAuthRoute()) {

  <!-- LOGIN e CADASTRO: tela cheia, sem header/footer públicos -->
  <router-outlet></router-outlet>

} @else {

  <!-- Mesmo topo do site; na área do cliente mostra os atalhos da conta -->
  <app-header [logado]="isUsuarioRoute()"></app-header>

  <router-outlet></router-outlet>

  <app-footer></app-footer>

}

<!-- Card de confirmação ao sair da conta -->
<app-confirmar-sair></app-confirmar-sair>
