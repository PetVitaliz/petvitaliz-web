<section class="login-page">

  <div class="login-card">

    <h2>
      Entrar com e-mail e senha
    </h2>

    <form (ngSubmit)="entrar()">

      <div class="form-group">
        <label for="email">E-mail</label>
        <div class="input-box">
          
          <span class="material-icons input-icon">email</span>

          <input type="email" id="email" name="email" placeholder="Digite seu e-mail" [(ngModel)]="email">
        </div>
      </div>

      <div class="form-group">
        <div class="label-row">
          <label for="senha">Senha</label>
          <a routerLink="/user/esqueci-senha">Esqueci minha senha</a>
        </div>

        <div class="input-box">
          
          <span class="material-icons input-icon">lock</span>

          <input [type]="senhaVisivel ? 'text' : 'password'" id="senha" name="senha" placeholder="Digite sua senha"
            [(ngModel)]="senha">

          <button type="button" class="eye-btn" (click)="senhaVisivel = !senhaVisivel" title="Mostrar/Esconder senha">
            <span class="material-icons">
              {{ senhaVisivel ? 'visibility' : 'visibility_off' }}
            </span>
          </button>
        </div>
      </div>

      <label class="remember">
        <input type="checkbox" name="lembrar" [(ngModel)]="lembrar">
        <span>Lembrar-me neste dispositivo</span>
      </label>

      <p class="erro" *ngIf="erro">
        {{ erro }}
      </p>

      <button type="submit" class="btn-login">
        Entrar
        <span class="material-icons btn-icon">arrow_forward</span>
      </button>

    </form>

    <div class="security-box">
      <div class="security-icon">
        <span class="material-icons">security</span>
      </div>
      <div>
        <strong>AMBIENTE SEGURO</strong>
        <p>
          Este portal é de uso exclusivo de colaboradores autorizados.
          Todo acesso é monitorado para garantir a segurança dos dados dos nossos pacientes e protocolos internos.
        </p>
      </div>
    </div>

    <button class="btn-register" type="button" routerLink="/user/cadastro">
      Cadastre-se
      <span class="material-icons btn-icon">arrow_forward</span>
    </button>

  </div>

</section>
