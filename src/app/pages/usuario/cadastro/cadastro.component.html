<section class="cadastro-page">
  <a class="back" routerLink="/usuario/login">&#10094;</a>

  <div class="page-text">
    <h1>Cadastro</h1>
    <p>Preencha os campos abaixo para criar sua conta</p>
  </div>

  <div class="cadastro-card">
    <p class="frame-text">Frame</p>

    <h2>Criar sua conta</h2>
    <p class="subtitle">
      Preencha os dados abaixo para começar sua experiência exclusiva.
    </p>

    <form class="cadastro-form">
      <div class="form-row">
        <div class="form-group">
          <label for="nome">Nome completo</label>
          <input type="text" id="nome" placeholder="ex: João" />
        </div>

        <div class="form-group">
          <label for="sobrenome">Sobrenome</label>
          <input type="text" id="sobrenome" placeholder="ex: Silva" />
        </div>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label for="cpf">CPF</label>
          <input type="text" id="cpf" placeholder="000.000.000-00" />
        </div>

        <div class="form-group">
          <label for="nascimento">Data de Nascimento</label>
          <input type="text" id="nascimento" placeholder="mm/dd/yyyy" />
        </div>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label for="telefone">Telefone</label>
          <input type="text" id="telefone" placeholder="(11) 99999-9999" />
        </div>

        <div class="form-group">
          <label for="genero">Gênero</label>
          <select id="genero">
            <option selected disabled>Selecione</option>
            <option>Feminino</option>
            <option>Masculino</option>
            <option>Prefiro não informar</option>
          </select>
        </div>
      </div>

      <div class="form-group full">
        <label for="email">E-mail</label>
        <input type="email" id="email" placeholder="seu@email.com.br" />
      </div>

      <div class="form-group full">
        <label for="senha">Senha</label>

        <div class="password-wrapper">
          <input type="password" id="senha" placeholder="••••••••" />
          <span class="eye">&#128065;</span>
        </div>

        <div class="password-strength">
          <span class="dot active"></span>
          <span class="dot active"></span>
          <span class="label">SEGURANÇA MÉDIA</span>
        </div>
      </div>

      <button type="submit" class="btn-submit">Cadastrar</button>

      <p class="login-link">
        Já tem uma conta?
        <a routerLink="/usuario/login">Entre</a>
      </p>
    </form>
  </div>
</section>
