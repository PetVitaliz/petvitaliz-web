<section class="reset-page">
  <div class="reset-card">
    <h1>Redefinir sua senha</h1>

    <form class="reset-form">
      <div class="form-group">
        <label>Senha</label>
        <input type="password" placeholder="Digite sua nova senha" />
      </div>

      <div class="form-group">
        <label>Confirmar senha</label>
        <input type="password" placeholder="Repita a nova senha" />
      </div>

      <button class="btn-primary">Redefinir senha</button>

      <p class="hint">
        Dica: utilize uma combinação de letras, números e símbolos.
      </p>

      <button class="btn-outline" routerLink="/usuario/login">
        Voltar ao login
      </button>
    </form>
  </div>
</section>
