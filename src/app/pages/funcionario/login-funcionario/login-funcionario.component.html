<app-header-funcionario-auth></app-header-funcionario-auth>

<section class="login-page">
  <div class="login-card">
    <h1>Login Funcionário</h1>

    <form class="login-form">
      <div class="form-group">
        <label>E-mail</label>
        <div class="input-icon">
          <span>📧</span>
          <input type="email" placeholder="nome@petvital.vet" />
        </div>
      </div>

      <div class="form-group">
        <div class="label-row">
          <label>Senha</label>
          <a routerLink="/funcionario/esqueci-senha">Esqueci minha senha</a>
        </div>

        <div class="input-icon">
          <span>🔒</span>
          <input type="password" placeholder="••••••••" />
          <span class="eye">👁️</span>
        </div>
      </div>

      <div class="remember">
        <input type="checkbox" id="lembrar" />
        <label for="lembrar">Lembrar-me neste dispositivo</label>
      </div>

      <button class="btn-primary">Entrar no Portal →</button>
    </form>

    <div class="security-box">
      <h3>AMBIENTE SEGURO</h3>
      <p>
        Este portal é de uso exclusivo de colaboradores autorizados.
        Todo acesso é monitorado para garantir a segurança dos dados
        dos nossos pacientes e protocolos internos.
      </p>
    </div>
  </div>
</section>
