<section class="reset-page">
  <div class="reset-card">

    <h2>Redefinir sua senha</h2>

    <form (ngSubmit)="redefinirSenha()">

      <div class="form-group">
        <label for="senha">Senha</label>

        <div class="input-box">
          <svg class="input-icon" viewBox="0 0 24 24">
            <path d="M7 10V8a5 5 0 0 1 10 0v2" />
            <rect x="5" y="10" width="14" height="10" rx="2" />
          </svg>

          <input
            [type]="senhaVisivel ? 'text' : 'password'"
            id="senha"
            name="senha"
            placeholder="Digite sua nova senha"
            [(ngModel)]="senha">

          <button type="button" class="eye-btn" (click)="senhaVisivel = !senhaVisivel">
            <svg *ngIf="!senhaVisivel" viewBox="0 0 24 24">
              <path d="M2 12s4-7 10-7 10 7 10 7-4 7-10 7S2 12 2 12Z" />
              <circle cx="12" cy="12" r="3" />
            </svg>

            <svg *ngIf="senhaVisivel" viewBox="0 0 24 24">
              <path d="M3 3l18 18" />
              <path d="M10.6 10.6A3 3 0 0 0 13.4 13.4" />
              <path d="M9.9 4.2A10.8 10.8 0 0 1 12 4c6 0 10 8 10 8a16.8 16.8 0 0 1-3.1 4.1" />
              <path d="M6.5 6.5C3.8 8.3 2 12 2 12s4 8 10 8a10.8 10.8 0 0 0 4.2-.9" />
            </svg>
          </button>
        </div>
      </div>

      <div class="form-group">
        <label for="confirmarSenha">Confirmar senha</label>

        <div class="input-box">
          <svg class="input-icon" viewBox="0 0 24 24">
            <path d="M7 10V8a5 5 0 0 1 10 0v2" />
            <rect x="5" y="10" width="14" height="10" rx="2" />
          </svg>

          <input
            [type]="confirmarVisivel ? 'text' : 'password'"
            id="confirmarSenha"
            name="confirmarSenha"
            placeholder="Confirme sua nova senha"
            [(ngModel)]="confirmarSenha">

          <button type="button" class="eye-btn" (click)="confirmarVisivel = !confirmarVisivel">
            <svg *ngIf="!confirmarVisivel" viewBox="0 0 24 24">
              <path d="M2 12s4-7 10-7 10 7 10 7-4 7-10 7S2 12 2 12Z" />
              <circle cx="12" cy="12" r="3" />
            </svg>

            <svg *ngIf="confirmarVisivel" viewBox="0 0 24 24">
              <path d="M3 3l18 18" />
              <path d="M10.6 10.6A3 3 0 0 0 13.4 13.4" />
              <path d="M9.9 4.2A10.8 10.8 0 0 1 12 4c6 0 10 8 10 8a16.8 16.8 0 0 1-3.1 4.1" />
              <path d="M6.5 6.5C3.8 8.3 2 12 2 12s4 8 10 8a10.8 10.8 0 0 0 4.2-.9" />
            </svg>
          </button>
        </div>
      </div>

      <p class="erro" *ngIf="erro">{{ erro }}</p>
      <p class="sucesso" *ngIf="sucesso">{{ sucesso }}</p>

      <button type="submit" class="btn-submit">
        <span>Redefinir senha</span>

        <svg viewBox="0 0 24 24">
          <path d="M5 12h14" />
          <path d="M13 6l6 6-6 6" />
        </svg>
      </button>
    </form>

    <a routerLink="/usuario/login" class="back-login">
      <svg viewBox="0 0 24 24">
        <path d="M19 12H5" />
        <path d="M11 6l-6 6 6 6" />
      </svg>

      <span>Voltar para o login</span>
    </a>

    <div class="security-box">
      <div class="security-icon">
        <svg viewBox="0 0 24 24">
          <path d="M12 3l7 3v5c0 5-3 8.5-7 10-4-1.5-7-5-7-10V6l7-3Z" />
          <path d="M9 12l2 2 4-5" />
        </svg>
      </div>

      <div>
        <strong>AMBIENTE SEGURO</strong>
        <p>
          Seus dados estão protegidos com tecnologia de segurança e criptografia.
          Apenas usuários autorizados podem acessar informações da plataforma.
        </p>
      </div>
    </div>

  </div>
</section>
