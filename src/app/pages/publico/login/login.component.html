<section class="login-page">

  <div class="login-card">

    <h2>Entrar com e-mail e senha</h2>

    <form (ngSubmit)="entrar()">

      <div class="form-group">

        <label for="email">E-mail</label>

        <div class="input-box">

          <span class="material-icons input-icon">
            mail
          </span>

          <input type="email" id="email" name="email" placeholder="Digite seu e-mail" [(ngModel)]="email">

        </div>

      </div>

      <div class="form-group">

        <div class="label-row">

          <label for="senha">Senha</label>

          <a routerLink="/esqueci-senha" class="forgot-password">

            Esqueci minha senha

          </a>

        </div>

        <div class="input-box">

          <span class="material-icons input-icon">
            lock
          </span>

          <input [type]="senhaVisivel ? 'text' : 'password'" id="senha" name="senha" placeholder="Digite sua senha"
            [(ngModel)]="senha">

          <button type="button" class="eye-btn" (click)="senhaVisivel = !senhaVisivel">

            <span class="material-icons" *ngIf="!senhaVisivel">

              visibility

            </span>

            <span class="material-icons" *ngIf="senhaVisivel">

              visibility_off

            </span>

          </button>

        </div>

      </div>

      <label class="remember">

        <input type="checkbox" name="lembrar" [(ngModel)]="lembrar">

        <span>
          Lembrar-me neste dispositivo
        </span>

      </label>

      <p class="erro" *ngIf="erro">

        {{ erro }}

      </p>

      <button type="submit" class="btn-login">

        Entrar
        <span>→</span>

      </button>

    </form>

    <div class="security-box">

      <div class="security-icon">

        <span class="material-icons">
          verified_user
        </span>

      </div>

      <div class="security-content">

        <strong>
          AMBIENTE SEGURO
        </strong>

        <p>
          Utilizamos protocolos avançados de segurança para proteger suas informações
          e garantir uma experiência confiável dentro da plataforma PetVitaliz.
        </p>

      </div>

    </div>

    <button class="btn-register" type="button" routerLink="/cadastro">

      Cadastre-se
      <span>→</span>

    </button>

  </div>

</section>
