<!-- Barra superior (só em telas pequenas) -->
<div class="mobile-bar">
  <button type="button" class="hamburguer" (click)="toggleMenu()" aria-label="Abrir menu">
    <svg viewBox="0 0 24 24"><line x1="4" x2="20" y1="12" y2="12"/><line x1="4" x2="20" y1="6" y2="6"/><line x1="4" x2="20" y1="18" y2="18"/></svg>
  </button>
  <img src="assets/img/logo.png" alt="PetVitaliz" class="mobile-logo">
  <span class="mobile-avatar">
    <img *ngIf="fotoAdmin" [src]="fotoAdmin" alt="">
    <span *ngIf="!fotoAdmin">{{ iniciais }}</span>
  </span>
</div>

<div class="backdrop" *ngIf="menuAberto" (click)="fecharMenus()"></div>

<nav class="sidebar" [class.aberta]="menuAberto">

  <!-- MARCA -->
  <a class="brand" routerLink="/adm/home" (click)="fecharMenus()">
    <div class="brand-icon">
      <span class="brand-logo">
        <img src="assets/img/logo.png" alt="PetVitaliz">
      </span>
    </div>

    <div class="brand-text">
      <strong>PetVitaliz</strong>
      <span>Painel administrativo</span>
    </div>
  </a>

  <!-- PERFIL -->
  <div class="profile-card">
    <div class="profile-avatar">
      <img *ngIf="fotoAdmin" [src]="fotoAdmin" alt="Foto do administrador">
      <span *ngIf="!fotoAdmin">{{ iniciais }}</span>
    </div>

    <div class="profile-info">
      <span class="profile-name" [title]="nomeAdmin">{{ nomeAdmin }}</span>
      <span class="profile-email" [title]="emailAdmin">{{ emailAdmin || 'Administrador' }}</span>
    </div>

    <span class="profile-status" title="Sessão ativa"></span>
  </div>

  <div class="menu-scroll">

    <ng-template #icone let-nome>
      <ng-container [ngSwitch]="nome">
        <svg *ngSwitchCase="'dashboard'" viewBox="0 0 24 24"><rect width="7" height="9" x="3" y="3" rx="1"/><rect width="7" height="5" x="14" y="3" rx="1"/><rect width="7" height="9" x="14" y="12" rx="1"/><rect width="7" height="5" x="3" y="16" rx="1"/></svg>
        <svg *ngSwitchCase="'agenda'" viewBox="0 0 24 24"><path d="M8 2v4"/><path d="M16 2v4"/><rect width="18" height="18" x="3" y="4" rx="2"/><path d="M3 10h18"/></svg>
        <svg *ngSwitchCase="'relogio'" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
        <svg *ngSwitchCase="'pata'" viewBox="0 0 24 24"><circle cx="11" cy="4" r="2"/><circle cx="18" cy="8" r="2"/><circle cx="20" cy="16" r="2"/><path d="M9 10a5 5 0 0 1 5 5v3.5a3.5 3.5 0 0 1-6.84 1.045Q6.52 17.48 4.46 16.84A3.5 3.5 0 0 1 5.5 10Z"/></svg>
        <svg *ngSwitchCase="'dinheiro'" viewBox="0 0 24 24"><path d="M19 7V4a1 1 0 0 0-1-1H5a2 2 0 0 0 0 4h15a1 1 0 0 1 1 1v4h-3a2 2 0 0 0 0 4h3a1 1 0 0 0 1-1v-2a1 1 0 0 0-1-1"/><path d="M3 5v14a2 2 0 0 0 2 2h15a1 1 0 0 0 1-1v-4"/></svg>
        <svg *ngSwitchCase="'escudo'" viewBox="0 0 24 24"><path d="M11.562 3.266a.5.5 0 0 1 .876 0L15.39 8.87a1 1 0 0 0 1.516.294L21.183 5.5a.5.5 0 0 1 .798.519l-2.834 10.246a1 1 0 0 1-.956.734H5.81a1 1 0 0 1-.957-.734L2.02 6.02a.5.5 0 0 1 .798-.519l4.276 3.664a1 1 0 0 0 1.516-.294z"/><path d="M5 21h14"/></svg>
        <svg *ngSwitchCase="'equipe'" viewBox="0 0 24 24"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
        <svg *ngSwitchCase="'chave'" viewBox="0 0 24 24"><path d="M20 13c0 5-3.5 7.5-7.66 8.95a1 1 0 0 1-.67-.01C7.5 20.5 4 18 4 13V6a1 1 0 0 1 1-1c2 0 4.5-1.2 6.24-2.72a1.17 1.17 0 0 1 1.52 0C14.51 3.81 17 5 19 5a1 1 0 0 1 1 1z"/><path d="m9 12 2 2 4-4"/></svg>
      </ng-container>
    </ng-template>

    <div class="menu-section">
      <span class="menu-label">MENU PRINCIPAL</span>
      <ul>
        <li *ngFor="let item of menuPrincipal">
          <a [routerLink]="item.rota" routerLinkActive="active"
             [routerLinkActiveOptions]="{ exact: !!item.exato }"
             [title]="item.rotulo" (click)="fecharMenus()">
            <ng-container *ngTemplateOutlet="icone; context: { $implicit: item.icone }"></ng-container>
            <span>{{ item.rotulo }}</span>
          </a>
        </li>
      </ul>
    </div>

    <div class="menu-section">
      <span class="menu-label">GESTÃO</span>
      <ul>
        <li *ngFor="let item of menuGestao">
          <a [routerLink]="item.rota" routerLinkActive="active"
             [routerLinkActiveOptions]="{ exact: !!item.exato }"
             [title]="item.rotulo" (click)="fecharMenus()">
            <ng-container *ngTemplateOutlet="icone; context: { $implicit: item.icone }"></ng-container>
            <span>{{ item.rotulo }}</span>
          </a>
        </li>
      </ul>
    </div>

  </div>

  <!-- RODAPÉ -->
  <div class="sidebar-footer">
    <div class="footer-divider"></div>

    <button type="button" class="logout-button" (click)="logout()">
      <svg viewBox="0 0 24 24"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" x2="9" y1="12" y2="12"/></svg>
      <span>Sair da conta</span>
    </button>

    <span class="sidebar-version">PetVitaliz · Clínica Veterinária</span>
  </div>

</nav>
